「おい地獄さ行ぐんだで！」
<p>二人はデッキの手すりに寄りかかって、蝸牛が背のびをしたように延びて、海を抱え込んでいる函館の街を見ていた。――漁夫は指元まで吸いつくした煙草を唾と一緒に捨てた。巻煙草はおどけたように、色々にひっくりかえって、高い船腹をすれずれに落ちて行った。彼は身体一杯酒臭かった。</p>
