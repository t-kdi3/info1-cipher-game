<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問題文の文字コード</title>
<style>
    body {
        margin: 16px;
        color: #333;
        font-family: sans-serif;
        line-height: 1.8;
    }

    .encoding-options {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
    }

    button {
        padding: 8px 12px;
        border: 1px solid #8793a1;
        border-radius: 6px;
        background: #fff;
        color: #23395d;
        font: inherit;
        cursor: pointer;
    }

    button[aria-pressed="true"] {
        background: #23395d;
        color: #fff;
    }

    button:disabled {
        cursor: wait;
    }

    pre {
        min-height: 180px;
        padding: 16px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fafafa;
        font: inherit;
        white-space: pre-wrap;
    }
</style>
</head>
<body>
<main>
    <h1>問題文の表示</h1>
    <p>文字コードを選んで、表示を切り替えてみましょう。</p>
    <div class="encoding-options" aria-label="文字コード">
        <button type="button" data-encoding="utf-8" aria-pressed="true" disabled>UTF-8</button>
        <button type="button" data-encoding="euc-jp" aria-pressed="false" disabled>EUC-JP</button>
        <button type="button" data-encoding="iso-2022-jp" aria-pressed="false" disabled>ISO-2022-JP</button>
        <button type="button" data-encoding="shift_jis" aria-pressed="false" disabled>Shift_JIS</button>
    </div>
    <p id="status" role="status" aria-live="polite">問題文を読み込んでいます...</p>
    <pre id="problemText"></pre>
</main>
<script>
const status = document.getElementById("status");
const problemText = document.getElementById("problemText");
const buttons = Array.from(document.querySelectorAll("[data-encoding]"));
let sourceBytes;

function showText(encoding) {
    try {
        const decoded = new TextDecoder(encoding).decode(sourceBytes);
        const sourceDocument = new DOMParser().parseFromString(decoded, "text/html");
        problemText.textContent = sourceDocument.body.textContent.trim();
        status.textContent = `${encoding}で表示しています。`;
        buttons.forEach((button) => {
            button.setAttribute(
                "aria-pressed",
                String(button.dataset.encoding === encoding)
            );
        });
    } catch (error) {
        status.textContent = `${encoding}で表示できませんでした: ${error.message}`;
    }
}

buttons.forEach((button) => {
    button.addEventListener("click", () => showText(button.dataset.encoding));
});

fetch("encoding-error-source.html")
    .then((response) => {
        if (!response.ok) {
            throw new Error(`問題文を読み込めませんでした（HTTP ${response.status}）。`);
        }
        return response.arrayBuffer();
    })
    .then((buffer) => {
        sourceBytes = buffer;
        buttons.forEach((button) => {
            button.disabled = false;
        });
        showText("utf-8");
    })
    .catch((error) => {
        status.textContent = error.message;
    });
</script>
</body>
</html>
