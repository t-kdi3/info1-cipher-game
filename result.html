<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゲーム結果 | 情報Ⅰ 暗号解読チャレンジ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <section class="page-card">
        <h1 id="resultTitle">ゲーム結果</h1>
        <div id="resultSummary" class="result-summary"></div>
        <p id="submitStatus" class="notice" role="status" aria-live="polite"></p>
        <button id="submitButton" type="button">記録を送信・再送信する</button>
        <button type="button" onclick="location.href='ranking.html'">ランキング・クラス平均を見る</button>
        <button class="back-btn" type="button" onclick="location.href='index.html'">次の参加者へ</button>
    </section>
</main>
<script src="js/config.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/common.js"></script>
<script>
const result = localStorage.getItem("gameResult")
    ? JSON.parse(localStorage.getItem("gameResult"))
    : null;
const summary = document.getElementById("resultSummary");
const submitButton = document.getElementById("submitButton");
const submitStatus = document.getElementById("submitStatus");
if (!result) {
    document.getElementById("resultTitle").textContent = "記録がありません";
    summary.textContent = "ゲームを開始してから結果を確認してください。";
    submitButton.disabled = true;
} else {
    document.getElementById("resultTitle").textContent =
        result.status === "complete" ? "全問クリア！" : "タイムアップ";
    [
        `クラス：${result.className}`,
        `出席番号：${result.studentNumber}`,
        `正答数：${result.solvedCount}/${result.totalCount}`,
        `経過時間：${Game.formatSeconds(result.elapsedSeconds)}`
    ].forEach((value) => {
        const line = document.createElement("p");
        line.textContent = value;
        summary.append(line);
    });
    submitButton.addEventListener("click", () => {
        Game.submitResult(result, submitStatus, submitButton);
    });
    if (localStorage.getItem("scoreSent") === "true") {
        submitButton.disabled = true;
        submitStatus.textContent = "この結果は送信済みです。";
    }
}
</script>
</body>
</html>
