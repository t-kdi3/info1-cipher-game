<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情報Ⅰ 暗号解読チャレンジ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <section class="page-card">
        <h1>情報Ⅰ 暗号解読チャレンジ</h1>
        <p>暗号の謎を解き、40分以内にすべての課題をクリアしよう。</p>
        <p>個人ランキングとクラスごとの平均正答数を記録します。</p>
        <hr>
        <form id="startForm">
            <label for="className">クラス</label>
            <select id="className" required>
                <option value="">クラスを選択してください</option>
                <option>1-1</option><option>1-2</option><option>1-3</option><option>1-4</option>
                <option>1-5</option><option>1-6</option><option>1-7</option><option>1-8</option>
            </select>
            <label for="studentNumber">出席番号</label>
            <input id="studentNumber" type="number" min="1" step="1" inputmode="numeric" placeholder="出席番号を入力" required>
            <button type="submit">ゲーム開始</button>
        </form>
        <p class="notice">制限時間は40分です。例題は集計に含まれません。</p>
        <button class="back-btn" type="button" onclick="location.href='ranking.html'">ランキング・クラス平均を見る</button>
    </section>
</main>
<script src="js/config.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/common.js"></script>
<script>
document.getElementById("startForm").addEventListener("submit", (event) => {
    event.preventDefault();
    const className = document.getElementById("className").value;
    const studentNumber = document.getElementById("studentNumber").value.trim();
    if (!/^1-[1-8]$/.test(className)) {
        alert("クラスを選択してください。");
        return;
    }
    if (!/^[1-9]\d*$/.test(studentNumber)) {
        alert("出席番号を正しく入力してください。");
        return;
    }
    Game.start(className, studentNumber);
});
</script>
</body>
</html>
