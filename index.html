<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情報Ⅰ 暗号解読チャレンジ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <section class="page-card">
        <h1 id="pageTitle">情報Ⅰ 暗号解読チャレンジ</h1>
        <p>暗号の謎を解き、40分以内にすべての課題をクリアしよう。</p>
        <p>個人ランキングとクラスごとの平均正答数を記録します。</p>
        <button id="exampleButton" class="back-btn" type="button">例題に挑戦（時間外）</button>
        <hr>
        <form id="startForm">
            <div id="studentFields">
                <label for="className">クラス</label>
                <select id="className" required>
                    <option value="">クラスを選択してください</option>
                    <option>1-1</option><option>1-2</option><option>1-3</option><option>1-4</option>
                    <option>1-5</option><option>1-6</option><option>1-7</option><option>1-8</option>
                </select>
                <label for="studentNumber">出席番号</label>
                <input id="studentNumber" type="number" min="1" step="1" inputmode="numeric" placeholder="出席番号を入力" required>
            </div>
            <div id="teacherFields" hidden>
                <label for="teacherName">氏名</label>
                <input id="teacherName" type="text" maxlength="40" autocomplete="name" placeholder="氏名を入力" disabled>
                <p class="notice">教員として参加します。氏名は教員ランキングに表示されます。</p>
            </div>
            <button id="startButton" type="submit">ゲーム開始</button>
        </form>
        <p class="notice">ゲーム開始後の制限時間は40分です。例題は時間外で、集計に含まれません。</p>
        <div class="ranking-links">
            <a class="button-link" href="ranking.html">生徒ランキング</a>
            <a class="button-link" href="ranking.html?includeTeachers=1">教員を含むランキング</a>
        </div>
    </section>
</main>
<script src="js/config.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/common.js"></script>
<script>
document.getElementById("exampleButton").addEventListener("click", () => {
    location.href = "challenge.html?id=example&practice=true";
});

let titleClicks = 0;
let titleClickTimer;
document.getElementById("pageTitle").addEventListener("click", () => {
    titleClicks += 1;
    clearTimeout(titleClickTimer);
    if (titleClicks >= 5) {
        document.getElementById("studentFields").hidden = true;
        document.getElementById("className").required = false;
        document.getElementById("studentNumber").required = false;
        document.getElementById("studentNumber").disabled = true;
        document.getElementById("teacherFields").hidden = false;
        document.getElementById("teacherName").required = true;
        document.getElementById("teacherName").disabled = false;
        document.getElementById("startButton").textContent = "教員としてゲーム開始";
        titleClicks = 0;
        return;
    }
    titleClickTimer = setTimeout(() => {
        titleClicks = 0;
    }, 2000);
});

document.getElementById("startForm").addEventListener("submit", (event) => {
    event.preventDefault();
    const teacherName = document.getElementById("teacherName").value.trim();
    if (!document.getElementById("teacherFields").hidden) {
        if (!teacherName || /[\u0000-\u001f\u007f]/.test(teacherName)) {
            alert("氏名を正しく入力してください。");
            return;
        }
        Game.start("教員", teacherName);
        return;
    }
    const className = document.getElementById("className").value;
    const studentNumber = document.getElementById("studentNumber").value.trim();
    if (!/^1-[1-8]$/.test(className)) {
        alert("クラスを選択してください。");
        return;
    }
    if (!/^[1-9]\d*$/.test(studentNumber)) {
        alert("出席番号を正しく入力してください。");
        return;
    }
    Game.start(className, studentNumber);
});
</script>
</body>
</html>
