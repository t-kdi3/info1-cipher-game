<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7：ソーシャルエンジニアリング</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <section class="page-card">
        <h1>7：ソーシャルエンジニアリング</h1>
        <div id="timer" class="timer"></div>
        <p>7-1・7-2の両方を解いてください。</p>
        <div id="socialArea" class="button-grid"></div>
        <h2>進行状況</h2>
        <div id="progressArea" class="progress-box"></div>
        <button class="back-btn" type="button" onclick="location.href='start.html'">課題一覧へ戻る</button>
    </section>
</main>
<script src="js/config.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/common.js"></script>
<script>
if (Game.guardSession()) {
    Game.startTimer(document.getElementById("timer"));
    Game.renderProgress(document.getElementById("progressArea"));
    const solved = JSON.parse(localStorage.getItem("solvedPuzzles") || "{}");
    GAME_PUZZLES.filter((puzzle) => puzzle.section === "ソーシャルエンジニアリング")
        .forEach((puzzle) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = `${puzzle.title}${solved[puzzle.id] ? "（正解済み）" : ""}`;
            button.addEventListener("click", () => {
                location.href = `challenge.html?id=${encodeURIComponent(puzzle.id)}`;
            });
            document.getElementById("socialArea").append(button);
        });
}
</script>
</body>
</html>
