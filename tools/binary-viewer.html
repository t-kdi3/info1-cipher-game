<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファイルビューア</title>
<style>
    body {
        max-width: 900px;
        margin: 24px auto;
        padding: 0 16px;
        color: #333;
        font-family: sans-serif;
        line-height: 1.6;
    }

    h1 {
        font-size: 1.5rem;
    }

    pre {
        overflow-x: auto;
        padding: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f5f6f8;
        font: 14px/1.5 monospace;
    }

    #hex {
        max-height: 65vh;
        overflow: auto;
        white-space: pre;
    }
</style>
</head>
<body>
<main>
    <h1>ファイルビューア</h1>
    <p>ファイルを選ぶと、データを16進数で表示します。ファイルは端末内で処理され、アップロードされません。</p>
    <label for="file">調べるファイル</label>
    <input id="file" type="file">
    <p id="status" role="status" aria-live="polite"></p>
    <pre id="hex" tabindex="0">ファイルを選択してください。</pre>
</main>
<script>
const fileInput = document.getElementById("file");
const status = document.getElementById("status");
const hex = document.getElementById("hex");

fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;

    status.textContent = `${file.name}（${file.size.toLocaleString()} バイト）`;
    const bytes = new Uint8Array(await file.arrayBuffer());
    const rows = [];
    const decoder = new TextDecoder("shift_jis");
    for (let offset = 0; offset < bytes.length; offset += 16) {
        const row = bytes.subarray(offset, Math.min(offset + 16, bytes.length));
        const hexBytes = Array.from(row, (byte) => byte.toString(16).padStart(2, "0")).join(" ");
        const decoded = decoder.decode(row, { stream: offset + 16 < bytes.length });
        const text = decoded.replace(/[\u0000-\u001f\u007f-\u009f�]/g, ".");
        rows.push(`${offset.toString(16).padStart(8, "0")}  ${hexBytes.padEnd(47)}  ${text}`);
    }
    hex.textContent = rows.join("\n");
});
</script>
</body>
</html>
