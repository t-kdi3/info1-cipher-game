<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>暗号解読 | 情報Ⅰ 暗号解読チャレンジ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <section class="page-card">
        <h1 id="challengeTitle">暗号解読課題</h1>
        <div id="timer" class="timer"></div>
        <div id="question" class="question-box"></div>
        <form id="answerForm">
            <div id="answerFields"></div>
            <button id="answerButton" type="submit">回答する</button>
        </form>
        <p id="answerStatus" class="notice" role="status" aria-live="polite"></p>
        <section id="progressSection">
            <h2>進行状況</h2>
            <div id="progressArea" class="progress-box"></div>
        </section>
        <button id="challengeBackButton" class="back-btn" type="button">課題一覧へ戻る</button>
    </section>
</main>
<script src="js/config.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/common.js"></script>
<script>
const challengeParams = new URLSearchParams(location.search);
const isPracticeExample =
    challengeParams.get("id") === "example" &&
    challengeParams.get("practice") === "true";
document.getElementById("challengeBackButton").addEventListener("click", () => {
    location.href = isPracticeExample ? "index.html" : "start.html";
});
if (isPracticeExample) {
    document.getElementById("timer").hidden = true;
    document.getElementById("progressSection").hidden = true;
    Game.renderChallenge();
} else if (Game.guardSession()) {
    Game.startTimer(document.getElementById("timer"));
    Game.renderProgress(document.getElementById("progressArea"));
    Game.renderChallenge();
}
</script>
</body>
</html>
